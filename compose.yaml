services:
  api:
    build:
      context: .
    ports:
      # [HOST_PORT] : [CONTAINER_PORT]
      - 8080:8080
    develop:
      watch:
        - path: ./pom.xml
          action: rebuild
        - path: ./src
          target: /app/src
          # use sync if you're using Spring Boot DevTools
          action: rebuild
